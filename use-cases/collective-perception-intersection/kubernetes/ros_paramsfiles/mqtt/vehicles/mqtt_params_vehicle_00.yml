mqtt_client_vehicle_00_ego_data:
  ros__parameters:
    broker:
      host: service-mqtt-broker-cloud
      port: 1883
    bridge:
      ros2mqtt:
        ros_topics: 
          - /clock
          - /tf
          - /tf_static
          - /vehicles/vehicle00/ego_data
        /clock:
          mqtt_topic: mqtt/clock
        /tf:
          mqtt_topic: mqtt/tf
        /tf_static:
          mqtt_topic: mqtt/tf_static
        /vehicles/vehicle00/ego_data:
          mqtt_topic: mqtt/vehicles/vehicle00/ego_data
    client: 
        id: "mqtt_client_vehicle_00_ego_data"