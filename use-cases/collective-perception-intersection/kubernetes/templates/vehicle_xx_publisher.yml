apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-${ID}-publisher
  labels:
    tag: robotkube
    app: vehicle-${ID}-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-${ID}-publisher
  template:
    metadata:
      labels:
        app: vehicle-${ID}-publisher
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        node_id: vehicle${ID}
      containers:
      - name: rosbag-play
        image: k3d-robotkube-registry.localhost:41670/robotkube:ros2_bag_files_collective_perception
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -c
          - |
            source install/setup.bash
            sleep infinity
