apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-02-mqtt
  labels:
    tag: robotkube
    app: vehicle-02-mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-02-mqtt
  template:
    metadata:
      labels:
        app: vehicle-02-mqtt
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        node_id: vehicle02
      containers:
      - name: mqtt-client-vehicle-02
        image: k3d-robotkube-registry.localhost:41670/mqtt_client:latest
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -c
          - |
            source install/setup.bash
            ros2 launch mqtt_client standalone.launch.ros2.xml node_name:=mqtt_client_vehicle_02_ego_data params_file:=/mounted_config/mqtt_params_vehicle_02.yml
        volumeMounts:
        - name: mqtt-vehicle-02-config-volume
          mountPath: /mounted_config
      volumes:
        - name: mqtt-vehicle-02-config-volume
          configMap:
            name: mqtt-params-vehicles
